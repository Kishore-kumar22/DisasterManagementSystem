{% extends 'base.html' %}
{% block title %}Publish alert | Responda{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-end mb-4"><div><span class="eyebrow">EMERGENCY BROADCAST</span><h1 class="page-title mb-1">Publish an alert</h1><p class="text-muted mb-0">This prototype delivers alerts inside the application only.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('alerts.list_alerts') }}">Cancel</a></div>
<div class="row"><div class="col-xl-8"><div class="panel-card"><form method="post"><div class="mb-3"><label class="form-label">Linked incident *</label><select name="disaster_id" class="form-select" required><option value="">Choose incident</option>{% for disaster in disasters %}<option value="{{ disaster.id }}">{{ disaster.title }} — {{ disaster.status }}</option>{% endfor %}</select></div><div class="row g-3"><div class="col-md-8"><label class="form-label">Alert title *</label><input class="form-control" name="title" required placeholder="Immediate resource mobilization required"></div><div class="col-md-4"><label class="form-label">Severity</label><select class="form-select" name="severity"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></div><div class="col-12"><label class="form-label">Message *</label><textarea class="form-control" name="message" rows="5" required placeholder="Write the operational message for authenticated responders."></textarea></div></div><div class="mt-4 d-flex justify-content-end gap-2"><a href="{{ url_for('alerts.list_alerts') }}" class="btn btn-light">Cancel</a><button class="btn btn-danger"><i class="bi bi-broadcast-pin me-1"></i>Publish alert</button></div></form></div></div></div>
{% endblock %}
